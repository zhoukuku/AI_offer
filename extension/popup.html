<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 300px; margin: 0; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1f2329; background: #fff; }
      .wrap { padding: 16px; }
      .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
      .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #4f5dff, #8b5cf6); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
      .brand b { font-size: 15px; }
      .brand small { display: block; color: #9aa0a6; font-size: 11px; }
      label { font-size: 12px; color: #6b7280; display: block; margin-bottom: 5px; }
      select, input, button { width: 100%; box-sizing: border-box; border-radius: 8px; font-size: 13px; }
      select, input { padding: 8px 10px; border: 1px solid #e6e8eb; margin-bottom: 10px; }
      button { padding: 9px 12px; border: 1px solid #e6e8eb; background: #fff; cursor: pointer; margin-bottom: 8px; transition: all .15s; }
      button.primary { background: #4f5dff; border-color: #4f5dff; color: #fff; font-weight: 500; }
      button:hover { filter: brightness(1.03); }
      .msg { font-size: 12px; min-height: 16px; margin-top: 6px; }
      .msg.ok { color: #16a34a; }
      .msg.err { color: #ef4444; }
      details.settings { border: 1px solid #e6e8eb; border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; background: #fafbff; }
      details.settings summary { cursor: pointer; font-size: 12px; color: #6b7280; user-select: none; }
      details.settings[open] { padding-bottom: 4px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <div class="logo">简</div>
        <div><b>简历工作台</b><small>网申填充 · 投递记录 · 面试复盘</small></div>
      </div>

      <details class="settings">
        <summary>⚙️ 连接设置</summary>
        <label for="apiUrl">后端地址（API）</label>
        <input id="apiUrl" type="text" placeholder="http://localhost:8787" />
        <label for="workspaceUrl">工作台地址</label>
        <input id="workspaceUrl" type="text" placeholder="http://localhost:5173" />
        <button id="saveSettings">保存设置</button>
      </details>

      <div id="auth">
        <label for="account">工作台账号</label><input id="account" autocomplete="username" placeholder="账号" />
        <label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="密码" />
        <button id="login" class="primary">登录并同步简历</button>
      </div>
      <button id="logout">退出插件登录</button>
      <label for="resume">选择要填充的简历</label>
      <select id="resume"></select>

      <button id="fill" class="primary">🪄 填充当前页面表单</button>
      <button id="record">📮 将当前页面记录为投递</button>
      <button id="open">🗓️ 打开工作台（面试复盘）</button>

      <div class="msg" id="msg"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
